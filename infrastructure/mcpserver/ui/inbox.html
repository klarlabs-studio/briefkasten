<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Briefkasten</title>
<style>
  :root {
    --paper: #f4f1e8;
    --card: #faf8f2;
    --ink: #1a1815;
    --ink-soft: #6e695f;
    --rule: #c8c3b9;
    --green: #175a39;
    --red: #a23129;
    --amber: #9a7416;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.5 "Helvetica Neue", Arial, sans-serif;
    padding: 1.2rem;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    font-weight: 500;
  }
  .sub { color: var(--ink-soft); font-size: 0.8rem; margin-bottom: 1rem; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
  button {
    font: inherit; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase;
    background: none; border: 1px solid var(--ink); color: var(--ink);
    padding: 0.35rem 0.8rem; cursor: pointer;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button.primary:hover { opacity: 0.9; }
  .msg {
    background: var(--card); border: 1px solid var(--rule);
    border-left: 3px solid var(--green);
    padding: 0.7rem 0.9rem; margin-bottom: 0.6rem;
  }
  .msg.read { border-left-color: var(--rule); }
  .msg header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.6rem 1rem; }
  .msg .from { color: var(--ink-soft); font-size: 0.78rem; word-break: break-word; }
  .msg .subject { font-weight: 600; word-break: break-word; }
  .msg .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .badge {
    font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--rule); padding: 0.05rem 0.35rem; margin-right: 0.4rem;
    color: var(--ink-soft);
  }
  .badge.unread { border-color: var(--green); color: var(--green); }
  select {
    font: inherit; font-size: 0.78rem; background: transparent;
    border: 1px solid var(--ink); color: var(--ink); padding: 0.3rem 0.5rem;
  }
  .bar input {
    font: inherit; font-size: 0.82rem; background: transparent;
    border: 1px solid var(--rule); color: var(--ink); padding: 0.3rem 0.5rem;
    flex: 1 1 9rem; min-width: 7rem;
  }
  .msg pre {
    font: 0.78rem/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; color: var(--ink-soft);
    border-top: 1px dashed var(--rule); margin-top: 0.5rem; padding-top: 0.5rem;
    max-height: 9rem; overflow: auto;
  }
  .empty, .error { padding: 1rem 0; color: var(--ink-soft); }
  .error { color: var(--red); }
  .msg .error { padding: 0.4rem 0 0; font-size: 0.78rem; }
  .msg .error:empty { display: none; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: none; color: var(--ink); }
  form.compose, form.inline { display: grid; gap: 0.5rem; }
  form.compose {
    background: var(--card); border: 1px solid var(--rule);
    padding: 0.9rem; margin-top: 1rem;
  }
  form.inline {
    border-top: 1px dashed var(--rule); margin-top: 0.6rem; padding-top: 0.6rem;
  }
  form.compose input, form.compose textarea,
  form.inline input, form.inline textarea {
    font: inherit; padding: 0.4rem 0.5rem;
    border: none; border-bottom: 1px solid var(--rule); background: transparent;
  }
  form.compose textarea { min-height: 5rem; }
  form.inline textarea { min-height: 4.5rem; }
  form.inline .label, form.compose .label {
    font-family: Georgia, "Times New Roman", serif; font-weight: 600;
  }
  form.inline .bar, form.compose .bar { margin-bottom: 0; }
  .status { font-size: 0.78rem; color: var(--green); }
  .status.bad { color: var(--red); }
  .hint { color: var(--ink-soft); font-size: 0.75rem; margin-bottom: 0.8rem; word-break: break-word; }
  .hint:empty { display: none; }
  .note { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem; margin-bottom: 0.8rem; font-size: 0.8rem; color: var(--ink-soft); }
  .note:empty { display: none; }
  .rule { border-top: 2px solid var(--ink); margin: 1.2rem 0 0.8rem; }
  .label { font-family: Georgia, "Times New Roman", serif; font-weight: 600; }
  .out {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem;
    border-bottom: 1px dashed var(--rule); padding: 0.4rem 0; font-size: 0.82rem;
  }
  .out .state {
    font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase;
    border: 1px solid var(--rule); padding: 0.05rem 0.35rem; color: var(--ink-soft);
  }
  .out .state.failed { border-color: var(--red); color: var(--red); }
  .out .state.queued, .out .state.sending { border-color: var(--amber); color: var(--amber); }
  .out .state.sent { border-color: var(--green); color: var(--green); }
  .out .oid { font: 0.76rem ui-monospace, Menlo, monospace; color: var(--ink-soft); word-break: break-all; }
</style>
</head>
<body>
  <h1>Briefkasten<span style="color:var(--green)">.</span></h1>
  <p class="sub">Mailbox over MCP — acknowledged only after you mark them. Archive and delete are soft moves: nothing is ever destroyed. Every send, reply and forward waits for you to approve it in the host.</p>

  <div class="bar">
    <select id="folder" aria-label="Which folder to read">
      <option value="">Inbox (default)</option>
    </select>
    <select id="scope" aria-label="Which messages to show">
      <option value="unread">Unread</option>
      <option value="read">Read</option>
      <option value="all">All</option>
    </select>
    <button id="refresh">Refresh</button>
    <span class="status" id="status"></span>
  </div>
  <p class="hint" id="curation"></p>

  <form class="bar" id="searchForm">
    <input id="query" type="search" placeholder="Search this folder" aria-label="Search mail" />
    <button type="submit">Search</button>
  </form>
  <p class="note" id="note"></p>

  <div id="list"></div>

  <div class="rule"></div>
  <form class="compose" id="compose">
    <span class="label">Compose</span>
    <input id="to" placeholder="To (comma-separated)" required />
    <input id="cc" placeholder="Cc (optional)" />
    <input id="bcc" placeholder="Bcc (optional — hidden from every recipient)" />
    <input id="subject" placeholder="Subject" required />
    <textarea id="body" placeholder="Body" required></textarea>
    <div class="bar">
      <button type="submit" class="primary">Queue send</button>
      <span class="status" id="sendStatus"></span>
    </div>
  </form>

  <div class="rule"></div>
  <section>
    <div class="bar">
      <span class="label">Outbox</span>
      <button id="outboxRefresh">Refresh</button>
      <span class="status" id="outboxStatus"></span>
    </div>
    <div id="outbox"></div>
  </section>

<script>
// Minimal MCP Apps bridge: JSON-RPC 2.0 over postMessage to the host.
let seq = 0;
const pending = new Map();
// The host is the only window allowed to answer. Without this check any
// frame that can reach this one — a sibling, an opener, an ad frame in a
// host that embeds several — can resolve a pending call with a result we
// never asked for, and the reply is rendered as mail. It cannot call a
// tool (requests only ever go up to the parent) but forging the answers
// is enough to put arbitrary content in front of the human.
//
// ev.source is compared rather than ev.origin because an MCP Apps frame
// does not know its host's origin in advance, and a sandboxed host has
// origin "null" — a value several windows can share, so it identifies
// nobody. The source is a window reference: it is exactly one window.
let hostOrigin = null;
window.addEventListener('message', (ev) => {
  if (ev.source !== window.parent) return;
  const m = ev.data;
  if (!m || m.jsonrpc !== '2.0' || !pending.has(m.id)) return;
  // Remember where the host speaks from, so replies stop being broadcast.
  // "null" is deliberately not remembered: it is what a sandboxed frame
  // reports, and targeting it would break the bridge rather than tighten
  // it, so those hosts keep the wildcard.
  if (hostOrigin === null && ev.origin && ev.origin !== 'null') hostOrigin = ev.origin;
  const { resolve, reject } = pending.get(m.id);
  pending.delete(m.id);
  if (m.error) reject(new Error(m.error.message || 'tool error'));
  else resolve(m.result);
});

// Reads answer straight away; archive, delete, send, reply, and forward
// are gated on a human confirming in the host, so they get room for
// someone to read the prompt and decide.
const READ_TIMEOUT = 8000;
const CONFIRM_TIMEOUT = 120000;

function rpc(method, params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const id = 'ui-' + ++seq;
    pending.set(id, { resolve, reject });
    // Targeted once the host has identified itself; '*' only until then,
    // and for sandboxed hosts that have no origin to target.
    window.parent.postMessage(
      { jsonrpc: '2.0', id, method, params },
      hostOrigin || '*',
    );
    setTimeout(() => {
      if (pending.has(id)) {
        pending.delete(id);
        reject(new Error('host bridge unavailable'));
      }
    }, timeoutMs || READ_TIMEOUT);
  });
}

function callTool(name, args, timeoutMs) {
  return rpc('tools/call', { name, arguments: args || {} }, timeoutMs);
}

function toolJSON(result) {
  // Tool results arrive as content blocks; the payload is JSON text.
  const block = (result && result.content && result.content[0]) || {};
  if (typeof block.text === 'string') {
    try { return JSON.parse(block.text); } catch { return block.text; }
  }
  return block.text ?? block;
}

function resourceJSON(result) {
  // Resource reads arrive as contents entries; ours are JSON text.
  const entry = (result && result.contents && result.contents[0]) || {};
  if (typeof entry.text === 'string') {
    try { return JSON.parse(entry.text); } catch { return null; }
  }
  return null;
}

function header(raw, name) {
  const m = raw.match(new RegExp('^' + name + ':\\s*(.+)$', 'mi'));
  return m ? m[1].trim() : '';
}

function addresses(value) {
  return value.split(',').map((s) => s.trim()).filter(Boolean);
}

const EMPTY = {
  unread: 'Inbox clear — nothing unread.',
  read: 'Nothing read yet.',
  all: 'Mailbox empty.',
};

// Whatever folder is on show scopes every call made about it, so acting
// on a message reaches the same one that was listed. An empty selection
// means the server's default folder — the inbox — and is left off the
// call rather than guessed at here.
function withFolder(args) {
  const folder = document.getElementById('folder').value;
  if (folder) args.folder = folder;
  return args;
}

// Folders come from the email://folders resource rather than a tool
// call: it is a plain read the host already has, and it carries the
// curation plan along with the folder list, so "where would Archive put
// this?" is answered before anyone is asked to approve a move.
async function loadFolders() {
  let payload = null;
  try {
    payload = resourceJSON(await rpc('resources/read', { uri: 'email://folders' }, READ_TIMEOUT));
  } catch {
    return; // A host that cannot read resources still gets the default folder.
  }
  if (!payload) return;
  const select = document.getElementById('folder');
  for (const name of Array.isArray(payload.folders) ? payload.folders : []) {
    // Folder names are server data: they set a value and a text node,
    // never markup.
    if (typeof name !== 'string' || !name) continue;
    const option = document.createElement('option');
    option.value = name;
    option.textContent = name;
    select.appendChild(option);
  }
  const plan = payload.curation;
  if (plan && plan.archive && plan.trash) {
    document.getElementById('curation').textContent =
      'Archive files into ' + plan.archive.folder + ' · Delete files into ' + plan.trash.folder + '.';
  }
}

// The outbox is the one place a send can go wrong after the human has
// approved it: email.send/reply/forward return an id and then deliver
// asynchronously, so without this a message that failed to leave is
// invisible in the surface that queued it. States come from the
// email://outbox resource — a plain read, like the folder list — rather
// than polling email.send_status per id.
//
// Order is deliberate: failures first, then work in flight, then sent.
// The interesting end of an outbox is the end that still needs someone.
const OUTBOX_STATES = ['failed', 'sending', 'queued', 'sent'];

async function loadOutbox() {
  const panel = document.getElementById('outbox');
  const status = document.getElementById('outboxStatus');
  status.className = 'status';
  status.textContent = 'loading…';
  let summary = null;
  try {
    summary = resourceJSON(await rpc('resources/read', { uri: 'email://outbox' }, READ_TIMEOUT));
  } catch (e) {
    status.className = 'status bad';
    status.textContent = e.message;
    return;
  }
  panel.replaceChildren();
  if (!summary || typeof summary !== 'object') {
    status.textContent = '';
    return;
  }
  let total = 0;
  for (const state of OUTBOX_STATES) {
    const ids = Array.isArray(summary[state]) ? summary[state] : [];
    total += ids.length;
    for (const id of ids) {
      if (typeof id !== 'string' || !id) continue;
      const row = document.createElement('div');
      row.className = 'out';
      const tag = document.createElement('span');
      tag.className = 'state ' + state;
      tag.textContent = state;
      const oid = document.createElement('span');
      // Outbox ids are server data: a text node, never markup.
      oid.className = 'oid';
      oid.textContent = id;
      row.append(tag, oid);
      // Only a failure is actionable from here. Retry re-queues the same
      // message the human already approved, so it does not ask again.
      if (state === 'failed') {
        const retry = document.createElement('button');
        retry.textContent = 'Retry';
        const note = document.createElement('span');
        note.className = 'status';
        retry.onclick = async () => {
          retry.disabled = true;
          note.className = 'status';
          note.textContent = 're-queuing…';
          try {
            const res = toolJSON(await callTool('email.retry', { id }, READ_TIMEOUT));
            note.textContent = res && res.state ? res.state : 'queued';
            loadOutbox();
          } catch (e) {
            retry.disabled = false;
            note.className = 'status bad';
            note.textContent = e.message;
          }
        };
        row.append(retry, note);
      }
      panel.appendChild(row);
    }
  }
  if (!total) {
    panel.replaceChildren(
      Object.assign(document.createElement('p'), { className: 'empty', textContent: 'Nothing queued.' }),
    );
  }
  const failed = Array.isArray(summary.failed) ? summary.failed.length : 0;
  status.className = failed ? 'status bad' : 'status';
  status.textContent = failed ? failed + ' failed' : total + ' queued or sent';
}

// action wires a button to a tool call over one message. Archive and
// delete carry no confirm flag: the host elicits the human, which is the
// whole point of the gate — the UI must not answer it on their behalf.
function action(label, tool, id, row) {
  const btn = document.createElement('button');
  btn.textContent = label;
  btn.onclick = async () => {
    const buttons = row.querySelectorAll('.actions button');
    buttons.forEach((b) => (b.disabled = true));
    try {
      await callTool(tool, withFolder({ id }), tool === 'email.mark_seen' ? READ_TIMEOUT : CONFIRM_TIMEOUT);
      refresh();
    } catch (e) {
      buttons.forEach((b) => (b.disabled = false));
      const note = row.querySelector('.error');
      note.textContent = e.message;
    }
  };
  return btn;
}

const COMPOSER = {
  reply: { label: 'Reply', submit: 'Queue reply', hint: 'Your reply — the original is quoted beneath it' },
  'reply-all': { label: 'Reply all', submit: 'Queue reply', hint: 'Your reply to everyone the original could see' },
  forward: { label: 'Forward', submit: 'Queue forward', hint: 'Note above the forwarded message (optional)' },
};

// composer opens under the message it answers rather than over it: the
// mail being replied to stays readable while it is being answered, and
// the row keeps its own status and errors. It carries no recipient field
// for a reply — the server reads the original and derives the audience,
// and handing that back to the caller is precisely what email.reply
// exists to avoid. Forward is the other case: its recipients are new, so
// a human types them.
function composer(mode, id, row) {
  const slot = row.querySelector('.composer');
  if (slot.dataset.open === mode) {
    slot.dataset.open = '';
    slot.replaceChildren();
    return;
  }
  const kind = COMPOSER[mode];
  const forward = mode === 'forward';
  const form = document.createElement('form');
  form.className = 'inline';
  // Static skeleton only; every value below is set as text.
  form.innerHTML =
    '<span class="label"></span>' +
    (forward ? '<input class="to" placeholder="Forward to (comma-separated)" required />' : '') +
    '<textarea class="body"></textarea>' +
    '<div class="bar"><button type="submit" class="primary"></button>' +
    '<button type="button" class="cancel">Cancel</button><span class="status"></span></div>';
  form.querySelector('.label').textContent = kind.label;
  form.querySelector('.body').placeholder = kind.hint;
  form.querySelector('.body').required = !forward;
  form.querySelector('button[type="submit"]').textContent = kind.submit;
  form.querySelector('.cancel').onclick = () => {
    slot.dataset.open = '';
    slot.replaceChildren();
  };
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const note = form.querySelector('.status');
    note.className = 'status';
    note.textContent = 'queuing…';
    const body = form.querySelector('.body').value;
    try {
      let res;
      if (forward) {
        res = toolJSON(await callTool('email.forward', withFolder({
          id,
          to: addresses(form.querySelector('.to').value),
          body,
        }), CONFIRM_TIMEOUT));
      } else {
        const args = withFolder({ id, body });
        // Reply-all widens the audience to everyone the original could
        // see. The flag is what the host's prompt counts recipients for,
        // so it travels; the answer to that prompt is the human's.
        if (mode === 'reply-all') args.all = true;
        res = toolJSON(await callTool('email.reply', args, CONFIRM_TIMEOUT));
      }
      note.textContent = 'queued: ' + res.id;
      form.querySelectorAll('input, textarea, button').forEach((f) => (f.disabled = true));
      loadOutbox();
    } catch (e) {
      // A declined send is reported here in the host's own words: the
      // refusal is the answer, not a bug to swallow.
      note.className = 'status bad';
      note.textContent = e.message;
    }
  };
  slot.dataset.open = mode;
  slot.replaceChildren(form);
}

function composeButton(mode, id, row) {
  const btn = document.createElement('button');
  btn.textContent = COMPOSER[mode].label;
  btn.onclick = () => composer(mode, id, row);
  return btn;
}

// query is the live search term; empty means the plain folder listing.
let query = '';

// searchNote states what is on show and offers the way back, since
// search results and a listing look alike once rendered.
function searchNote(total) {
  const note = document.getElementById('note');
  note.replaceChildren();
  if (!query) return;
  note.append(total + ' matching ' + (total === 1 ? 'message' : 'messages') + ' for “' + query + '”');
  const back = document.createElement('button');
  back.textContent = 'Back to listing';
  back.onclick = () => {
    query = '';
    document.getElementById('query').value = '';
    refresh();
  };
  note.appendChild(back);
}

async function refresh() {
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const scope = document.getElementById('scope').value;
  status.textContent = 'loading…';
  list.innerHTML = '';
  try {
    // Search and list answer in the same shape, so the results replace
    // the listing in place rather than opening a second surface.
    const { ids, total } = toolJSON(query
      ? await callTool('email.search', withFolder({ query, scope }))
      : await callTool('email.list', withFolder({ scope })));
    // Under scope=all a message's state is not implied by the listing,
    // so ask which ids are still unread rather than guessing.
    let unread = new Set(ids);
    if (scope === 'read') {
      unread = new Set();
    } else if (scope === 'all') {
      unread = new Set(toolJSON(await callTool('email.list', withFolder({ scope: 'unread' }))).ids);
    }
    status.textContent = total + ' ' + (scope === 'all' ? 'messages' : scope);
    searchNote(total);
    if (!ids.length) {
      list.replaceChildren(
        Object.assign(document.createElement('p'), {
          className: 'empty',
          textContent: query ? 'Nothing matched.' : EMPTY[scope],
        }),
      );
      return;
    }
    for (const id of ids.slice(0, 10)) {
      const { raw: b64 } = toolJSON(await callTool('email.fetch', withFolder({ id })));
      const raw = atob(b64);
      const isUnread = unread.has(id);
      const el = document.createElement('article');
      el.className = isUnread ? 'msg' : 'msg read';
      el.innerHTML =
        '<header><div><div class="subject"><span class="badge"></span></div><div class="from"></div></div>' +
        '<div class="actions"></div></header><pre></pre><div class="composer"></div><p class="error"></p>';
      const badge = el.querySelector('.badge');
      badge.className = isUnread ? 'badge unread' : 'badge';
      badge.textContent = isUnread ? 'unread' : 'read';
      el.querySelector('.subject').append(header(raw, 'Subject') || '(no subject)');
      el.querySelector('.from').textContent = header(raw, 'From') + ' · ' + id;
      el.querySelector('pre').textContent = raw.split(/\r?\n\r?\n/).slice(1).join('\n\n').trim();
      const actions = el.querySelector('.actions');
      if (isUnread) {
        actions.appendChild(action('Mark seen', 'email.mark_seen', id, el));
      }
      actions.appendChild(composeButton('reply', id, el));
      actions.appendChild(composeButton('reply-all', id, el));
      actions.appendChild(composeButton('forward', id, el));
      // Curation reaches read mail too — the backend resolves an id
      // whatever its state, so both buttons stay on every row.
      actions.appendChild(action('Archive', 'email.archive', id, el));
      actions.appendChild(action('Delete', 'email.delete', id, el));
      list.appendChild(el);
    }
  } catch (e) {
    status.textContent = '';
    list.replaceChildren(Object.assign(document.createElement('p'), { className: 'error', textContent: e.message }));
  }
}

document.getElementById('refresh').onclick = refresh;
document.getElementById('scope').onchange = refresh;
document.getElementById('folder').onchange = () => {
  // A folder change re-runs whatever is on show, search included: the
  // term belongs to the reader, the folder to the mailbox.
  refresh();
};
document.getElementById('searchForm').onsubmit = (ev) => {
  ev.preventDefault();
  query = document.getElementById('query').value.trim();
  refresh();
};
document.getElementById('compose').onsubmit = async (ev) => {
  ev.preventDefault();
  const sendStatus = document.getElementById('sendStatus');
  sendStatus.className = 'status';
  sendStatus.textContent = 'queuing…';
  try {
    const args = {
      to: addresses(document.getElementById('to').value),
      subject: document.getElementById('subject').value,
      body: document.getElementById('body').value,
    };
    // Cc and Bcc are left off entirely when empty rather than sent as
    // empty lists; the host's prompt counts recipients, and an absent
    // field is not a recipient.
    const cc = addresses(document.getElementById('cc').value);
    const bcc = addresses(document.getElementById('bcc').value);
    if (cc.length) args.cc = cc;
    if (bcc.length) args.bcc = bcc;
    const res = toolJSON(await callTool('email.send', args, CONFIRM_TIMEOUT));
    sendStatus.textContent = 'queued: ' + res.id;
    ev.target.reset();
    // The message it just queued is now the newest thing in the outbox,
    // so show it there rather than leaving the panel a refresh behind.
    loadOutbox();
  } catch (e) {
    sendStatus.className = 'status bad';
    sendStatus.textContent = e.message;
  }
};

document.getElementById('outboxRefresh').onclick = loadOutbox;

loadFolders();
refresh();
