name: Release

on:
  push:
    tags: ["v*"]
  # Dispatch this workflow from main with the target release tag as input. The
  # workflow definition must come from main; only the source checkout should
  # come from the tag, so retries use current release tooling without moving tags.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.33.0)
        required: true
        type: string

# Default for anything added later: read-only. The release job widens this for
# itself, and only for itself.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload artifacts to it.
      contents: write
      # OIDC token for cosign keyless signing and for build provenance. This is
      # the token cosign trades at Fulcio for a short-lived signing certificate;
      # no key material is stored anywhere.
      id-token: write
      # Write the build-provenance attestation to GitHub's attestation store.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race ./...
      # cosign and nox must exist before goreleaser runs: the `signs:` and
      # `sboms:` blocks in .goreleaser.yaml shell out to them.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Generate dependency SBOM
        uses: nox-hq/nox@0b56bd883d8db126a4711ae9a5c1eb5c8ac45c4b # v1.54.0
        with:
          path: .
          format: cdx
          output: ${{ runner.temp }}/nox-sbom
          version: v1.54.0
          fail-on-findings: 'false'
          annotate: 'false'
          offline: 'true'
      - name: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Build provenance via GitHub rather than goreleaser: goreleaser v2 OSS
      # has no attestation support (its schema exposes `signs`/`sboms` and
      # nothing else in that space), so the alternative would be hand-rolling
      # in-toto statements through a `publishers:` hook. This action produces
      # SLSA v1 provenance signed with the same OIDC identity, stores it in
      # GitHub's attestation API, and is verifiable with plain
      # `gh attestation verify` — no extra tooling for the consumer.
      #
      # `subject-checksums` reuses the checksums.txt goreleaser already wrote,
      # so every archive and SBOM listed there is covered by one attestation
      # and the subject list cannot drift from what was actually released.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
