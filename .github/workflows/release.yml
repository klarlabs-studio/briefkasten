name: Release

on:
  push:
    tags: ["v*"]
  # Re-drive a release that published its artifacts and then failed on a later
  # step, without re-tagging. v0.31.0 did exactly that: all 22 signed artifacts
  # and SBOMs uploaded, then the Homebrew cask push failed, leaving the release
  # correct and `brew upgrade` a version behind with no way to finish the job
  # from CI. Dispatch against the TAG (`--ref v0.31.0`), not a branch: goreleaser
  # reads the config and version from the ref it runs on.
  workflow_dispatch:

# Default for anything added later: read-only. The release job widens this for
# itself, and only for itself.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload artifacts to it.
      contents: write
      # OIDC token for cosign keyless signing and for build provenance. This is
      # the token cosign trades at Fulcio for a short-lived signing certificate;
      # no key material is stored anywhere.
      id-token: write
      # Write the build-provenance attestation to GitHub's attestation store.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race ./...
      # cosign and nox must exist before goreleaser runs: the `signs:` and
      # `sboms:` blocks in .goreleaser.yaml shell out to them. Pin both tools
      # to exact versions.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Install nox
        run: go install github.com/nox-hq/nox/cli@v1.54.0
      - name: Generate dependency SBOM
        run: nox scan . --only deps --format cdx --output nox-sbom --offline --tracked-only
      - name: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Build provenance via GitHub rather than goreleaser: goreleaser v2 OSS
      # has no attestation support (its schema exposes `signs`/`sboms` and
      # nothing else in that space), so the alternative would be hand-rolling
      # in-toto statements through a `publishers:` hook. This action produces
      # SLSA v1 provenance signed with the same OIDC identity, stores it in
      # GitHub's attestation API, and is verifiable with plain
      # `gh attestation verify` — no extra tooling for the consumer.
      #
      # `subject-checksums` reuses the checksums.txt goreleaser already wrote,
      # so every archive and SBOM listed there is covered by one attestation
      # and the subject list cannot drift from what was actually released.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
