name: Release

on:
  push:
    tags: ["v*"]
  # Dispatch this workflow from main with the target release tag as input. The
  # workflow definition must come from main; only the source checkout should
  # come from the tag, so retries use current release tooling without moving tags.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v0.33.0)
        required: true
        type: string

# Default for anything added later: read-only. The release job widens this for
# itself, and only for itself.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload artifacts to it.
      contents: write
      # OIDC token for cosign keyless signing and for build provenance. This is
      # the token cosign trades at Fulcio for a short-lived signing certificate;
      # no key material is stored anywhere.
      id-token: write
      # Write the build-provenance attestation to GitHub's attestation store.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race ./...
      # cosign and nox must exist before goreleaser runs: the `signs:` and
      # `sboms:` blocks in .goreleaser.yaml shell out to them.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.2
      # This job can write releases and mint signing certificates, so the nox
      # binary it runs is checked against a committed sha256 (from nox's
      # cosign-verified checksums.txt for this version) rather than trusted on
      # download. Keep NOX_VERSION at the fleet-wide pin.
      - name: Install nox (sha256-verified)
        env:
          NOX_VERSION: "1.63.0"
          NOX_SHA256: "58c4f348675d2d965e6577bb5d040d387eea82e2d0a4baeb288721f1b0d1b453"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/nox.tar.gz" \
            "https://github.com/nox-hq/nox/releases/download/v${NOX_VERSION}/nox_${NOX_VERSION}_linux_amd64.tar.gz"
          echo "${NOX_SHA256}  $tmp/nox.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/nox.tar.gz" -C "$tmp" nox
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$tmp/nox" "$HOME/.local/bin/nox"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nox" version
      - name: Generate dependency SBOM
        # Same as the nox action did before: install the plugins .nox.yaml
        # requires, scan offline, and do not gate on findings (exit 1). Any
        # other exit code is a failed scan.
        run: |
          set -euo pipefail
          nox install --root . --quiet
          out="$RUNNER_TEMP/nox-sbom"
          rc=0
          nox --format cdx --output "$out" -q scan . --offline || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::nox scan failed with exit code $rc"
            exit "$rc"
          fi
          test -s "$out/sbom.cdx.json"
      # The workflow and release config come from main, while source comes from the selected tag.
      # This keeps retries of older tags aligned with the current SBOM and release tooling.
      - name: Load current GoReleaser config
        run: git show origin/main:.goreleaser.yaml > "$RUNNER_TEMP/.goreleaser.yaml"
      - name: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean --config ${{ runner.temp }}/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Build provenance via GitHub rather than goreleaser: goreleaser v2 OSS
      # has no attestation support (its schema exposes `signs`/`sboms` and
      # nothing else in that space), so the alternative would be hand-rolling
      # in-toto statements through a `publishers:` hook. This action produces
      # SLSA v1 provenance signed with the same OIDC identity, stores it in
      # GitHub's attestation API, and is verifiable with plain
      # `gh attestation verify` — no extra tooling for the consumer.
      #
      # `subject-checksums` reuses the checksums.txt goreleaser already wrote,
      # so every archive and SBOM listed there is covered by one attestation
      # and the subject list cannot drift from what was actually released.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
