name: Release

on:
  push:
    tags: ["v*"]

# Default for anything added later: read-only. The release job widens this for
# itself, and only for itself.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload artifacts to it.
      contents: write
      # OIDC token for cosign keyless signing and for build provenance. This is
      # the token cosign trades at Fulcio for a short-lived signing certificate;
      # no key material is stored anywhere.
      id-token: write
      # Write the build-provenance attestation to GitHub's attestation store.
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race ./...
      # cosign and syft must exist before goreleaser runs: the `signs:` and
      # `sboms:` blocks in .goreleaser.yaml shell out to them. Both are pinned
      # to an exact tool version, not just an action SHA — an action SHA pins
      # the installer, not what the installer fetches.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.49.0
      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Build provenance via GitHub rather than goreleaser: goreleaser v2 OSS
      # has no attestation support (its schema exposes `signs`/`sboms` and
      # nothing else in that space), so the alternative would be hand-rolling
      # in-toto statements through a `publishers:` hook. This action produces
      # SLSA v1 provenance signed with the same OIDC identity, stores it in
      # GitHub's attestation API, and is verifiable with plain
      # `gh attestation verify` — no extra tooling for the consumer.
      #
      # `subject-checksums` reuses the checksums.txt goreleaser already wrote,
      # so every archive and SBOM listed there is covered by one attestation
      # and the subject list cannot drift from what was actually released.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt
