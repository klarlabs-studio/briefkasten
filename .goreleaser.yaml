# goreleaser configuration — release on v* tags via GitHub Actions.
version: 2

project_name: briefkasten

before:
  hooks:
    - go mod tidy

builds:
  - id: briefkasten
    main: ./cmd/briefkasten
    binary: briefkasten
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Other
      order: 999
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"

homebrew_casks:
  - repository:
      owner: klarlabs-studio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/klarlabs-studio/briefkasten"
    description: "A mailbox as an MCP server"
    license: "MIT"
    # The binary is unsigned, so macOS quarantines it on download and
    # Gatekeeper refuses to run it. Strip the attribute after staging.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/briefkasten"]
          end

release:
  draft: false
  prerelease: auto
