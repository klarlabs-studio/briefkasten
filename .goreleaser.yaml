# goreleaser configuration — release on v* tags via GitHub Actions.
#
# ---------------------------------------------------------------------------
# Verifying a briefkasten release
# ---------------------------------------------------------------------------
# Every archive, every SBOM, and checksums.txt are signed with cosign in
# keyless mode. There is no public key to distribute and no private key to
# leak: the signing identity is this repository's release workflow, certified
# by GitHub's OIDC issuer and logged in Sigstore's transparency log. Each
# signature ships as a Sigstore bundle (`<artifact>.sigstore.json`) holding the
# signature, the short-lived certificate, and the Rekor inclusion proof.
#
# Substitute the version you downloaded for 0.27.0 below.
#
# 1. Fetch an artifact, its bundle, and its SBOM:
#
#      gh release download v0.27.0 -R klarlabs-studio/briefkasten \
#        -p 'briefkasten_0.27.0_darwin_arm64.tar.gz*'
#
# 2. Verify the signature. The identity regexp is the load-bearing part — it
#    pins *which* workflow in *which* repository was allowed to sign:
#
#      cosign verify-blob \
#        --bundle briefkasten_0.27.0_darwin_arm64.tar.gz.sigstore.json \
#        --certificate-identity-regexp '^https://github\.com/klarlabs-studio/briefkasten/\.github/workflows/release\.yml@refs/tags/v' \
#        --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#        briefkasten_0.27.0_darwin_arm64.tar.gz
#
#    Same command for checksums.txt / checksums.txt.sigstore.json.
#
# 3. Verify build provenance — that this exact byte sequence came out of this
#    repository's release workflow, from a named commit (SLSA v1 provenance,
#    attested by GitHub, see .github/workflows/release.yml):
#
#      gh attestation verify briefkasten_0.27.0_darwin_arm64.tar.gz \
#        -R klarlabs-studio/briefkasten \
#        --signer-workflow klarlabs-studio/briefkasten/.github/workflows/release.yml
#
# 4. Read the SBOM (CycloneDX JSON, one per archive):
#
#      jq -r '.components[] | "\(.name)\t\(.version)"' \
#        briefkasten_0.27.0_darwin_arm64.tar.gz.sbom.cdx.json
#
#    ...or scan it for known vulnerabilities:
#
#      grype sbom:./briefkasten_0.27.0_darwin_arm64.tar.gz.sbom.cdx.json
#
#    The repo's own OpenVEX document (vex.json) records triage for findings
#    that are not exploitable here.
# ---------------------------------------------------------------------------
version: 2

project_name: briefkasten

before:
  hooks:
    - go mod tidy

builds:
  - id: briefkasten
    main: ./cmd/briefkasten
    binary: briefkasten
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# One SBOM per archive, generated by syft. The release workflow installs syft
# (anchore/sbom-action/download-syft) before goreleaser runs; without it this
# step fails loudly rather than silently shipping an unattested archive.
# CycloneDX JSON, because it is what the OpenVEX document this repo already
# carries (vex.json) is meant to be read against, and what grype/nox consume.
sboms:
  - id: archive-sbom
    artifacts: archive
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "cyclonedx-json=$document"
    documents:
      - "${artifact}.sbom.cdx.json"

# Keyless signing of every uploadable artifact — archives, SBOMs, and
# checksums.txt. cosign takes the workflow's GitHub OIDC token (hence
# `id-token: write` on the release job), exchanges it at Fulcio for a
# short-lived certificate, signs, and records the signature in Rekor. No key
# material exists to manage or rotate.
#
# `--bundle` is required: cosign v3 dropped the v2-era `--output-signature` /
# `--output-certificate` flags in favour of a single Sigstore bundle. The
# release workflow pins cosign to a v3 release accordingly.
signs:
  - id: cosign-keyless
    cmd: cosign
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    signature: "${artifact}.sigstore.json"
    artifacts: all
    output: true

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Other
      order: 999
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"

homebrew_casks:
  # The cask lives in the tap owned by the org that owns this repo. The
  # token comes from the klarlabs-studio org secret, so it reaches org
  # repos; pointing this at a personal tap is what made v0.31.0's cask
  # step fail with a 403 while the release itself published fine.
  - repository:
      owner: klarlabs-studio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/klarlabs-studio/briefkasten"
    description: "A mailbox as an MCP server"
    license: "MIT"
    # The binary is unsigned, so macOS quarantines it on download and
    # Gatekeeper refuses to run it. Strip the attribute after staging.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/briefkasten"]
          end

release:
  draft: false
  prerelease: auto
