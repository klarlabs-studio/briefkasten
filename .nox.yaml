scan:
  exclude:
    # Baseline file: contains high-entropy fingerprint hashes (SHA-256 hex)
    # that match the SEC-680 "Prometheus API key" regex; these ARE the
    # finding fingerprints, not actual secrets.
    - ".nox/baseline.json"
    # go.sum: module digests look like API keys to entropy-based detectors.
    - "go.sum"
    - "**/go.sum"
    # CI workflows: pinned commit SHAs + GITHUB_TOKEN references look like
    # secret patterns to entropy-based rules.
    - ".github/workflows/*.yml"
    # Documentation contains example code snippets and curl commands with
    # placeholder tokens / API keys.
    - "README.md"
    - "CHANGELOG.md"
    - "docs/*.md"
    - "**/README.md"
    # Generated coverage badge.
    - "assets/coverage-badge.svg"
    # Grafana dashboard JSON contains Prometheus query expressions that
    # match SEC-680 against `prometheus_*_total` metric names.
    - "assets/grafana/*.json"
    # Generated artifacts.
    - "nox-out/"
    - "release-artifacts/"

# Activate nox code-level taint SAST (source-to-sink: SSRF, injection,
# path traversal). nox scan auto-installs (cosign-verified) + runs it.
plugins:
  required:
    - nox/taint-analysis
    # Go reachability. Without it an OSV hit is just "this module is in the
    # graph", which reads as urgent whether or not the vulnerable symbol is
    # ever called — three advisories looked actionable here on 2026-07-25 and
    # none were. With it, CI answers REACH-001 (never called) or REACH-002
    # (reachable) and the difference between a blocked release and a note is
    # visible without a second tool.
    #
    # Requires >= 0.8.1: earlier builds answered "unsupported ecosystem go"
    # (the plugin matched OSV's ecosystem spellings while nox tags findings
    # with its own), and 0.8.0 was built with a Go older than this module's,
    # which x/vuln cannot load.
    - nox/reachability
